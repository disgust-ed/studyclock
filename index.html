<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>시험 공부 집중 타이머</title>
  <style>
    :root {
      --bg-main: #1f1713;
      --bg-card: #2d221c;
      --bg-sub: #241b17;
      --bg-dark: #1a1310;
      --border-color: #45352d;
      --text-main: #f5ebe6;
      --text-muted: #bba89e;
      --text-white: #ffffff;
      --primary-blue: #2563eb;
      --primary-blue-hover: #1d4ed8;
      --accent-amber: #f59e0b;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --radius-pill: 9999px;
      --radius-card: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.5;
      padding: 20px 16px 48px;
      min-height: 100vh;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    header h1 {
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--text-white);
      letter-spacing: -0.02em;
    }

    .header-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    /* 모든 버튼 둥근 알약 모양 통일 */
    button {
      border: none;
      border-radius: var(--radius-pill);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 12px 22px;
      min-height: 46px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--text-main);
      background-color: var(--bg-sub);
      border: 1px solid var(--border-color);
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      background-color: #382a23;
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* 시작 버튼 파란색 강조 */
    .btn-primary {
      background-color: var(--primary-blue);
      color: var(--text-white);
      border-color: var(--primary-blue);
      font-size: 1.05rem;
      padding: 14px 32px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-blue-hover);
      border-color: var(--primary-blue-hover);
    }

    .btn-danger {
      background-color: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.4);
    }

    .btn-danger:hover:not(:disabled) {
      background-color: rgba(239, 68, 68, 0.28);
    }

    .btn-lock.active {
      background-color: var(--accent-amber);
      color: #1f1713;
      border-color: var(--accent-amber);
      font-weight: 700;
    }

    .btn-sm {
      padding: 8px 16px;
      min-height: 38px;
      font-size: 0.85rem;
    }

    input, select {
      background-color: var(--bg-dark);
      color: var(--text-white);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-pill);
      padding: 12px 18px;
      min-height: 46px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary-blue);
    }

    input:disabled, select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 20px;
      align-items: start;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--text-white);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 모드 전환 탭 */
    .mode-switch {
      display: flex;
      gap: 10px;
      background-color: var(--bg-dark);
      padding: 6px;
      border-radius: var(--radius-pill);
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }

    .mode-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      min-height: 42px;
    }

    .mode-btn.active.focus-mode {
      background-color: #4f3a2f;
      color: var(--text-white);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    .mode-btn.active.break-mode {
      background-color: #1e463a;
      color: #a7f3d0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    /* 원형 게이지 및 큰 흰색 타이머 */
    .timer-display-wrapper {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 10px auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .progress-ring {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .progress-ring-bg {
      fill: none;
      stroke: var(--bg-dark);
      stroke-width: 12;
    }

    .progress-ring-bar {
      fill: none;
      stroke: var(--primary-blue);
      stroke-width: 12;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.35s linear, stroke 0.3s ease;
    }

    .timer-center-text {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .timer-status-badge {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: var(--radius-pill);
      background-color: var(--bg-dark);
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .timer-digits {
      font-size: 4.1rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.03em;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
    }

    .timer-subject-label {
      margin-top: 8px;
      font-size: 0.9rem;
      color: var(--accent-amber);
      font-weight: 600;
    }

    .timer-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    /* 프리셋 & 직접 시간 설정 */
    .preset-section {
      border-top: 1px solid var(--border-color);
      padding-top: 18px;
    }

    .section-label {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 10px;
      font-weight: 600;
    }

    .preset-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .preset-btn.active {
      background-color: #4f3a2f;
      border-color: var(--accent-amber);
      color: var(--text-white);
    }

    .custom-time-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .custom-time-row input {
      width: 90px;
      text-align: center;
    }

    /* 우측 패널: 목표 달성 & 과목 관리 & 그래프 */
    .right-column {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .summary-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat-box {
      background-color: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 14px 16px;
    }

    .stat-label {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text-white);
    }

    .goal-bar-container {
      background-color: var(--bg-dark);
      border-radius: var(--radius-pill);
      height: 16px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      margin: 10px 0 14px;
    }

    .goal-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary-blue), #38bdf8);
      border-radius: var(--radius-pill);
      transition: width 0.4s ease;
    }

    .goal-input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .goal-input-row input {
      flex: 1;
    }

    /* 과목 관리 */
    .subject-select-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .subject-select-row select {
      flex: 1;
    }

    .subject-add-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .subject-add-row input {
      flex: 1;
    }

    .subject-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 210px;
      overflow-y: auto;
    }

    .subject-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 10px 14px;
      font-size: 0.92rem;
    }

    .subject-item-info {
      display: flex;
      flex-direction: column;
    }

    .subject-item-name {
      font-weight: 700;
      color: var(--text-white);
    }

    .subject-item-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* 반응형 막대 그래프 */
    .chart-wrapper {
      width: 100%;
      background-color: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 14px;
    }

    canvas {
      width: 100%;
      height: 190px;
      display: block;
    }

    /* 완료 로그 */
    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-dark);
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 0.88rem;
      border: 1px solid var(--border-color);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background-color: #3b2d26;
      color: var(--text-white);
      border: 1px solid var(--accent-amber);
      padding: 12px 24px;
      border-radius: var(--radius-pill);
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 999;
      text-align: center;
      max-width: 90vw;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 스마트폰 및 태블릿 반응형 최적화 */
    @media (max-width: 820px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 540px) {
      body {
        padding: 14px 12px 40px;
      }

      header {
        flex-direction: column;
        align-items: stretch;
      }

      .header-controls {
        justify-content: space-between;
      }

      .header-controls button {
        flex: 1;
      }

      .timer-display-wrapper {
        width: 230px;
        height: 230px;
      }

      .timer-digits {
        font-size: 3.4rem;
      }

      /* 스마트폰 입력창 및 버튼 세로 배치 */
      .timer-controls,
      .custom-time-row,
      .goal-input-row,
      .subject-select-row,
      .subject-add-row {
        flex-direction: column;
        align-items: stretch;
      }

      .custom-time-row input {
        width: 100%;
      }

      button, input, select {
        width: 100%;
        min-height: 48px;
      }

      .preset-buttons button {
        width: auto;
        flex: 1 1 45%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>시험 공부 집중 타이머</h1>
      <div class="header-controls">
        <button id="soundToggleBtn" type="button" title="알림음 켜기/끄기">🔔 알림음 켜짐</button>
        <button id="testSoundBtn" type="button" class="btn-sm">알림 테스트</button>
        <button id="lockModeBtn" type="button" class="btn-lock">🔓 집중 잠금 해제됨</button>
      </div>
    </header>

    <div class="main-grid">
      <!-- 왼쪽: 타이머 영역 -->
      <section class="card">
        <div class="mode-switch">
          <button id="focusModeBtn" type="button" class="mode-btn active focus-mode">📖 집중 타이머</button>
          <button id="breakModeBtn" type="button" class="mode-btn break-mode">☕ 휴식 타이머</button>
        </div>

        <div class="timer-display-wrapper">
          <svg class="progress-ring" viewBox="0 0 260 260">
            <circle class="progress-ring-bg" cx="130" cy="130" r="114"></circle>
            <circle id="progressRingBar" class="progress-ring-bar" cx="130" cy="130" r="114"></circle>
          </svg>
          <div class="timer-center-text">
            <div id="timerModeBadge" class="timer-status-badge">집중 모드</div>
            <div id="timerDisplay" class="timer-digits">50:00</div>
            <div id="activeSubjectLabel" class="timer-subject-label">선택 과목: 국어</div>
          </div>
        </div>

        <div class="timer-controls">
          <button id="startPauseBtn" type="button" class="btn-primary">▶ 집중 시작</button>
          <button id="resetTimerBtn" type="button">↺ 초기화</button>
          <button id="skipPhaseBtn" type="button">⏭ 다음 단계</button>
        </div>

        <div class="preset-section">
          <div class="section-label">자주 쓰는 공부/휴식 프리셋</div>
          <div class="preset-buttons" id="presetGroup">
            <button type="button" class="preset-btn active" data-focus="50" data-break="10">50분 집중 / 10분 휴식</button>
            <button type="button" class="preset-btn" data-focus="25" data-break="5">25분 집중 / 5분 휴식</button>
            <button type="button" class="preset-btn" data-focus="80" data-break="20">80분 실전 / 20분 휴식</button>
            <button type="button" class="preset-btn" data-focus="40" data-break="10">40분 집중 / 10분 휴식</button>
          </div>

          <div class="section-label">직접 시간 설정 (분)</div>
          <div class="custom-time-row">
            <input type="number" id="customFocusInput" min="1" max="240" value="50" aria-label="집중 시간(분)" />
            <input type="number" id="customBreakInput" min="1" max="120" value="10" aria-label="휴식 시간(분)" />
            <button type="button" id="applyCustomTimeBtn">시간 적용</button>
          </div>
        </div>
      </section>

      <!-- 오른쪽: 목표, 과목 관리, 그래프 및 기록 -->
      <div class="right-column">
        <!-- 오늘의 누적 공부 & 목표 진행 바 -->
        <section class="card">
          <div class="card-title">
            <span>🎯 오늘의 목표 및 누적 공부 시간</span>
            <span id="goalPercentText" style="color: #38bdf8; font-size: 0.95rem;">0% 달성</span>
          </div>

          <div class="summary-stats">
            <div class="stat-box">
              <div class="stat-label">오늘 누적 공부 시간</div>
              <div class="stat-value" id="totalStudyDisplay">0분</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">오늘 목표 시간</div>
              <div class="stat-value" id="goalTargetDisplay">240분</div>
            </div>
          </div>

          <div class="goal-bar-container">
            <div id="goalProgressBar" class="goal-bar-fill"></div>
          </div>

          <div class="goal-input-row">
            <input type="number" id="dailyGoalInput" min="10" max="1440" step="10" placeholder="목표 시간(분)" value="240" />
            <button type="button" id="saveGoalBtn">목표 설정</button>
          </div>
        </section>

        <!-- 과목 선택 및 누적 시간 -->
        <section class="card">
          <div class="card-title">
            <span>📚 과목별 집중 관리</span>
          </div>

          <div class="subject-select-row">
            <select id="subjectSelect" aria-label="공부할 과목 선택"></select>
            <button type="button" id="deleteSubjectBtn" class="btn-danger">과목 삭제</button>
          </div>

          <div class="subject-add-row">
            <input type="text" id="newSubjectInput" maxlength="20" placeholder="새 과목명 입력 (예: 한국사, 물리)" />
            <button type="button" id="addSubjectBtn">+ 과목 추가</button>
          </div>

          <ul id="subjectStatsList" class="subject-list"></ul>
        </section>

        <!-- 반응형 과목별 공부 시간 그래프 -->
        <section class="card">
          <div class="card-title">
            <span>📊 과목별 공부 시간 그래프</span>
          </div>
          <div class="chart-wrapper">
            <canvas id="subjectChart"></canvas>
          </div>
        </section>

        <!-- 오늘의 완료 기록 -->
        <section class="card">
          <div class="card-title">
            <span>✅ 오늘의 집중 완료 기록</span>
            <button type="button" id="clearTodayDataBtn" class="btn-sm btn-danger">기록 초기화</button>
          </div>
          <ul id="historyList" class="history-list"></ul>
        </section>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    (function () {
      const STORAGE_KEY = "exam_focus_timer_v1";

      function getTodayKey() {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
      }

      const defaultState = {
        date: getTodayKey(),
        focusMinutes: 50,
        breakMinutes: 10,
        dailyGoalMinutes: 240,
        selectedSubject: "국어",
        subjects: {
          "국어": { minutes: 0, sessions: 0 },
          "수학": { minutes: 0, sessions: 0 },
          "영어": { minutes: 0, sessions: 0 },
          "탐구": { minutes: 0, sessions: 0 }
        },
        history: [],
        soundEnabled: true
      };

      let appState = loadState();
      let mode = "focus"; // "focus" | "break"
      let totalSeconds = appState.focusMinutes * 60;
      let remainingSeconds = totalSeconds;
      let timerInterval = null;
      let isRunning = false;
      let isLocked = false;

      // DOM 요소 참조
      const timerDisplay = document.getElementById("timerDisplay");
      const timerModeBadge = document.getElementById("timerModeBadge");
      const activeSubjectLabel = document.getElementById("activeSubjectLabel");
      const progressRingBar = document.getElementById("progressRingBar");
      const startPauseBtn = document.getElementById("startPauseBtn");
      const resetTimerBtn = document.getElementById("resetTimerBtn");
      const skipPhaseBtn = document.getElementById("skipPhaseBtn");
      const focusModeBtn = document.getElementById("focusModeBtn");
      const breakModeBtn = document.getElementById("breakModeBtn");
      const lockModeBtn = document.getElementById("lockModeBtn");
      const soundToggleBtn = document.getElementById("soundToggleBtn");
      const testSoundBtn = document.getElementById("testSoundBtn");

      const presetButtons = document.querySelectorAll(".preset-btn");
      const customFocusInput = document.getElementById("customFocusInput");
      const customBreakInput = document.getElementById("customBreakInput");
      const applyCustomTimeBtn = document.getElementById("applyCustomTimeBtn");

      const totalStudyDisplay = document.getElementById("totalStudyDisplay");
      const goalTargetDisplay = document.getElementById("goalTargetDisplay");
      const goalPercentText = document.getElementById("goalPercentText");
      const goalProgressBar = document.getElementById("goalProgressBar");
      const dailyGoalInput = document.getElementById("dailyGoalInput");
      const saveGoalBtn = document.getElementById("saveGoalBtn");

      const subjectSelect = document.getElementById("subjectSelect");
      const newSubjectInput = document.getElementById("newSubjectInput");
      const addSubjectBtn = document.getElementById("addSubjectBtn");
      const deleteSubjectBtn = document.getElementById("deleteSubjectBtn");
      const subjectStatsList = document.getElementById("subjectStatsList");
      const historyList = document.getElementById("historyList");
      const clearTodayDataBtn = document.getElementById("clearTodayDataBtn");
      const subjectChart = document.getElementById("subjectChart");
      const toastEl = document.getElementById("toast");

      // SVG 원형 게이지 설정
      const RADIUS = 114;
      const CIRCUMFERENCE = 2 * Math.PI * RADIUS;
      progressRingBar.style.strokeDasharray = `${CIRCUMFERENCE} ${CIRCUMFERENCE}`;
      progressRingBar.style.strokeDashoffset = "0";
